name: Pact Contract Generation
on: [push]

jobs:
  generate-pact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pact-python pytest requests

      - name: Run Consumer Test
        run: |
          pytest tests/test_consumer.py

      - name: Upload Pact Contract
        uses: actions/upload-artifact@v4
        with:
          name: pacted-contract
          path: "*.json"