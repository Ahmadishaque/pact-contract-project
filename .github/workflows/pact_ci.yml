name: Pact Contract Generation
on: [push]

jobs:
  generate-pact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pact-python==2.2.1 pytest requests

      - name: Run Consumer Test
        run: |
          pytest tests/test_consumer.py

      - name: Upload Pact Contract
        uses: actions/upload-artifact@v4
        with:
          name: pacted-contract
          path: "*.json"

      - name: Run Provider Verification
        run: |
          # 1. Start the Flask app in the background
          python app_provider.py & 
          # 2. Wait a few seconds for it to boot
          sleep 5 
          # 3. Run the verification test
          pytest tests/test_provider.py