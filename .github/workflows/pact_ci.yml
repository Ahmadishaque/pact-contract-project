name: Pact Contract Generation
on: [push]

jobs:
  generate-pact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip uninstall -y pact
          pip install -r requirements.txt

      - name: Run Consumer Test
        run: |
          pytest tests/test_consumer.py

      - name: Upload Pact Contract
        uses: actions/upload-artifact@v4
        with:
          name: pacted-contract
          path: "*.json"

      - name: Run Provider Verification
        run: |
          # Start the Flask app and redirect logs to a file so it doesn't hang
          python app_provider.py > provider_logs.txt 2>&1 & 
          # Give it a bit more time to spin up
          sleep 10
          # Run the verification
          pytest tests/test_provider.py